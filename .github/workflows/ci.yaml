name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/amd64
          load: true
          tags: nats-bridge:ci

      - name: Check grpc_health_probe
        run: docker run --rm --entrypoint /grpc_health_probe nats-bridge:ci -version

      - name: Start NATS with a stream
        run: |
          docker network create smoke
          docker run -d --name nats --network smoke nats:2-alpine -js
          for _ in $(seq 1 30); do
            if docker run --rm --network smoke natsio/nats-box:latest \
              nats stream add SMOKE_EVENTS --server=nats://nats:4222 --subjects='smoke.>' --defaults; then
              exit 0
            fi
            sleep 1
          done
          docker logs nats
          exit 1

      - name: Start bridge and probe health
        run: |
          cat > "$RUNNER_TEMP/config.json" <<'JSON'
          {
            "nats": {"url": "nats://nats:4222", "stream": "SMOKE_EVENTS"},
            "routes": [{"subject": "smoke.events", "endpoint": "http://127.0.0.1:9"}]
          }
          JSON
          docker run -d --name bridge --network smoke \
            -v "$RUNNER_TEMP/config.json:/config.json:ro" \
            -e CONFIG_PATH=/config.json \
            nats-bridge:ci
          for _ in $(seq 1 30); do
            if docker exec bridge /grpc_health_probe -addr=:8080; then
              exit 0
            fi
            sleep 1
          done
          docker logs bridge
          exit 1

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          scan-type: fs
          vuln-type: 'os,library'
